<title>Gemeinsames Kompendium Rettungsdienst</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1d2a33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: eine Spalte wie ein Taschenheft, Suche oben, Navigation unten am Daumen; Ergebnisse als ruhige Zeilen, Warnungen als farbige Streifen. */
:root {
  --bg: #eef1f2;
  --surface: #ffffff;
  --ink: #16222b;
  --muted: #56636c;
  --line: #d4dadd;
  --accent: #c2410c;      /* Signalorange */
  --accent-ink: #ffffff;
  --accent-soft: #fde9df;
  --warn: #8a5a00;
  --warn-bg: #fff4d6;
  --block: #a11a1a;
  --block-bg: #fde4e4;
  --ok: #1d6b43;
  --ok-bg: #e2f3e9;
  --bar: #1d2a33;
  --bar-ink: #f2f5f6;
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151a; --surface: #182129; --ink: #e5ebee; --muted: #9aa8b1; --line: #2b3842;
  --accent: #ff8a4c; --accent-ink: #1a0f08; --accent-soft: #3a2116;
  --warn: #f4c560; --warn-bg: #33290f; --block: #ff8d8d; --block-bg: #3a1a1c; --ok: #7fd6a3; --ok-bg: #15301f;
  --bar: #0a0f13; --bar-ink: #e5ebee; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f151a; --surface: #182129; --ink: #e5ebee; --muted: #9aa8b1; --line: #2b3842;
  --accent: #ff8a4c; --accent-ink: #1a0f08; --accent-soft: #3a2116;
  --warn: #f4c560; --warn-bg: #33290f; --block: #ff8d8d; --block-bg: #3a1a1c; --ok: #7fd6a3; --ok-bg: #15301f;
  --bar: #0a0f13; --bar-ink: #e5ebee; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); -webkit-text-size-adjust: 100%; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar); color: var(--bar-ink);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 760px; margin: 0 auto; display: grid; gap: 8px; }
.brand { display: flex; align-items: center; gap: 10px; min-height: 36px; }
.brand h1 { margin: 0; font: 700 1.35rem/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; flex: 1; min-width: 0; text-wrap: balance; }
.brand h1 span { color: var(--accent); }
.brand { flex-wrap: wrap; row-gap: 8px; }
.brand h1 { order: -1; flex: 1 1 100%; }
.brand .regchip { margin-left: auto; }
.brand h1 .unoff { display: block; font: 500 .7rem/1.3 var(--f-body); text-transform: none; letter-spacing: 0; opacity: .75; margin-top: 2px; }
.back { background: transparent; border: 1px solid #ffffff40; color: var(--bar-ink); border-radius: 8px; padding: 4px 12px; min-height: 36px; cursor: pointer; }
.kgchip { font: 600 .9rem/1 var(--f-num); background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
.regchip { background: transparent; color: var(--bar-ink); border: 1px solid #ffffff60; max-width: 11ch; overflow: hidden; text-overflow: ellipsis; }
.search { width: 100%; border: 0; border-radius: 8px; padding: 11px 14px; background: #ffffff; color: #16222b; font-size: 1rem; }
:root[data-theme="dark"] .search { background: #24303a; color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .search { background: #24303a; color: var(--ink); } }
.search::placeholder { color: #7b8890; }

main { max-width: 760px; margin: 0 auto; padding-block: 14px 110px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
.notice { font-size: .85rem; color: var(--muted); border-left: 4px solid var(--accent); padding: 6px 10px; background: var(--surface); border-radius: 0 8px 8px 0; }
.notice strong { color: var(--ink); }

h2.sec { font: 700 1.05rem/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 8px 0 0; }
.list { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; background: var(--surface); padding: 12px 14px; min-height: 52px; text-decoration: none; color: inherit; border: 0; width: 100%; text-align: left; cursor: pointer; }
.row:hover { background: var(--accent-soft); }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font-weight: 700; }
.row .t small { display: block; color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; }
.row .pg { font: 500 .78rem/1 var(--f-num); color: var(--muted); white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--line); }
.dot.calc { background: var(--accent); }
.dot.flag { background: var(--warn); }

.detail { display: grid; gap: 14px; }
.dh { display: grid; gap: 4px; }
.dh h2 { margin: 0; font: 700 2rem/1.05 var(--f-display); text-wrap: balance; }
.dh .meta { color: var(--muted); font-size: .9rem; }
.src { font: 500 .8rem/1.4 var(--f-num); color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.card h3 { margin: 0; font: 700 1rem/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .06em; }
.card ul { margin: 0; padding-left: 1.15em; display: grid; gap: 4px; }
.card.ki { border-left: 6px solid var(--block); }
.card.ki h3 { color: var(--block); }
.card.dos { border-left: 6px solid var(--accent); }
.card.dos h3 { color: var(--accent); }
.flag { background: var(--warn-bg); color: var(--ink); border-left: 6px solid var(--warn); border-radius: 8px; padding: 10px 12px; font-size: .92rem; }
.flag b { color: var(--warn); }
.hint { font-size: .85rem; color: var(--muted); font-style: italic; }
.grid2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: .92rem; }
.chip:hover { border-color: var(--accent); }

/* Dosierhilfe */
.kgbox { background: var(--surface); border: 2px solid var(--accent); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 10px; }
.kgrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.kgrow label { display: grid; gap: 4px; font-weight: 700; font-size: .9rem; }
.kgin { width: 9ch; font: 600 1.6rem/1 var(--f-num); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.steps button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; font: 500 .9rem var(--f-num); cursor: pointer; min-width: 48px; }
.res { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.res + .res { margin-top: 0; }
.res-h { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.res-h b { font: 700 1.15rem/1.1 var(--f-display); }
.res-h button { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: .85rem; text-decoration: underline; }
.rule { padding: 10px 14px; display: grid; gap: 6px; border-top: 1px solid var(--line); }
.rule:first-of-type { border-top: 0; }
.rule .lab { font-weight: 700; }
.rule .lab small { font-weight: 400; color: var(--muted); }
.big { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; }
.dose { font: 600 1.55rem/1.1 var(--f-num); font-variant-numeric: tabular-nums; }
.vol { font: 500 .95rem/1.3 var(--f-num); color: var(--ink); }
.vol span { color: var(--muted); font-family: var(--f-body); font-size: .85rem; }
.formula { font: 500 .8rem/1.3 var(--f-num); color: var(--muted); }
.msg { font-size: .88rem; padding: 6px 10px; border-radius: 6px; }
.msg.block { background: var(--block-bg); color: var(--block); font-weight: 700; }
.msg.cap { background: var(--warn-bg); color: var(--warn); font-weight: 700; }
.msg.info { background: var(--bg); color: var(--muted); }
.msg.warn { background: var(--warn-bg); color: var(--ink); border-left: 4px solid var(--warn); }
.rule.blocked .dose, .rule.blocked .vol { opacity: .45; text-decoration: line-through; }
.bands { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: .9rem; }
.bands li { padding: 3px 8px; border-radius: 6px; color: var(--muted); }
.bands li.on { background: var(--ok-bg); color: var(--ok); font-weight: 700; }
.dotab { width: 100%; border-collapse: collapse; font-size: .92rem; }
.dotab td { border-top: 1px solid var(--line); padding: 6px 4px; vertical-align: top; }
.dotab td.lv { text-align: right; white-space: nowrap; font: 600 .9rem/1.3 var(--f-num); }
.dotab td.lv.none { color: var(--muted); font-weight: 500; font-style: italic; }
.dotab small { display: block; color: var(--muted); font-size: .8rem; }
.dotab tr.g td { border-top: 0; padding-top: 12px; font: 700 .8rem/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.card.do { border-left: 6px solid var(--ok); }
.dotab details { margin-top: 4px; font-size: .85rem; }
.dotab details summary { cursor: pointer; color: var(--muted); }
.allreg { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; margin-top: 4px; }
.allreg .on { font-weight: 700; color: var(--ok); }
.flag.excl { background: var(--block-bg, var(--warn-bg)); border-left-color: var(--block); }
.card ul li.br { list-style: none; margin-left: -1.15em; display: grid; gap: 4px; padding: 8px 10px; border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 8px; background: var(--bg); }
.br .gl { font: 700 .75rem/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.br .c { font-weight: 700; }
.br .c.sub { margin-top: 4px; padding-top: 6px; border-top: 1px dashed var(--line); }
.br .a { display: flex; gap: 8px; align-items: baseline; padding-left: 4px; }
.br .a::before { content: "➜"; color: var(--accent); font-weight: 700; flex: none; }
.br .ja { font: 700 .72rem/1 var(--f-num); color: var(--ok); background: var(--ok-bg); border-radius: 4px; padding: 2px 5px; flex: none; }
.br .lk { font-size: .8rem; padding: 2px 9px; margin-left: 4px; }
table.age { border-collapse: collapse; width: 100%; font-size: .92rem; }
table.age td { border-top: 1px solid var(--line); padding: 5px 4px; vertical-align: top; }
table.age td:last-child { font-family: var(--f-num); font-weight: 600; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs-in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { background: none; border: 0; padding: 10px 4px 12px; cursor: pointer; display: grid; justify-items: center; gap: 3px; font: 700 .78rem/1 var(--f-body); color: var(--muted); border-top: 3px solid transparent; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }
.empty { color: var(--muted); padding: 20px 4px; text-align: center; }
@media (prefers-reduced-motion: no-preference) { .row, .chip { transition: background .12s, border-color .12s; } }

/* Ablauf / Flussdiagramm */
.card.flow { border-left: 6px solid var(--accent); }
.card.flow h3 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.fsrc { font: 400 .75rem/1 var(--f-num); text-transform: none; letter-spacing: 0; color: var(--muted); }
.flegend { display: flex; flex-wrap: wrap; gap: 6px; font-size: .75rem; }
.lg { border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
.lg.med { background: var(--accent-soft); border-color: var(--accent); }
.lg.opt { border-style: dashed; border-color: var(--ink); }
.lg.fe { background: var(--bar); color: var(--bar-ink); border-color: var(--bar); }
.fh { font: 700 .9rem/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-top: 6px; }
.fl { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; min-width: 0; }
.fl > li { position: relative; padding-left: 18px; padding-bottom: 10px; min-width: 0; }
.fl > li::before { content: ""; position: absolute; left: 6px; top: 0; bottom: 0; border-left: 2px solid var(--line); }
.fl > li::after { content: ""; position: absolute; left: 2px; top: 12px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--muted); }
.fl > li:last-child::before { bottom: auto; height: 14px; }
.fl > li > span:first-child { display: block; }
.fs > span:first-child, .fst > span, .fe > span:first-child, .fg > span:first-child { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); overflow-wrap: anywhere; }
.fst > span { font-weight: 700; border-radius: 999px; border-color: var(--warn); background: var(--warn-bg); }
.fs.med > span:first-child { background: var(--accent-soft); border: 2px solid var(--accent); font-weight: 700; }
.fs.opt > span:first-child { border: 2px dashed var(--ink); }
.fs.info > span:first-child { background: transparent; border-style: dotted; color: var(--muted); font-size: .9rem; }
.fe > span:first-child { background: var(--bar); color: var(--bar-ink); border-color: var(--bar); font-weight: 700; }
.fl > li.fe::after { background: var(--ink); border-color: var(--ink); border-radius: 2px; }
.fg > span:first-child { border-style: dashed; color: var(--accent); font-weight: 700; }
.fg > span:first-child::before { content: "↩ "; }
.fln { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.fc { color: var(--muted); font-size: .8rem; }
.fl > li.fc::after { display: none; }
.fq > .qq { display: flex; gap: 8px; align-items: flex-start; padding: 7px 10px; border-radius: 8px; border: 2px solid var(--warn); background: var(--warn-bg); font-weight: 700; overflow-wrap: anywhere; }
.fl > li.fq::after { transform: rotate(45deg); border-radius: 1px; border-color: var(--warn); background: var(--warn-bg); }
.qm { flex: none; width: 1.3em; height: 1.3em; display: grid; place-items: center; border-radius: 50%; background: var(--warn); color: var(--surface); font: 700 .8rem/1 var(--f-num); margin-top: 1px; }
.bs { display: grid; gap: 6px; margin-top: 6px; min-width: 0; }
.bx { border: 1px solid var(--line); border-left: 4px solid var(--muted); border-radius: 8px; padding: 6px 8px 0 6px; background: var(--surface); min-width: 0; }
.bx.ja { border-left-color: var(--ok); }
.bx.nein { border-left-color: var(--block); }
.bx.x { border-left-color: var(--accent); }
.bx.empty { display: flex; gap: 8px; align-items: center; padding-bottom: 6px; }
.bx summary { cursor: pointer; padding-bottom: 6px; list-style: none; display: flex; align-items: center; gap: 6px; }
.bx summary::-webkit-details-marker { display: none; }
.bx summary::after { content: "▾"; color: var(--muted); margin-left: auto; }
.bx:not([open]) summary::after { content: "▸"; }
.bl { font: 700 .75rem/1 var(--f-num); border-radius: 4px; padding: 3px 7px; background: var(--bg); color: var(--ink); text-transform: uppercase; }
.bl.ja { color: var(--ok); background: var(--ok-bg); }
.bl.nein { color: var(--block); background: var(--block-bg); }
.bl.x { color: var(--accent); background: var(--accent-soft); text-transform: none; }
.wt { color: var(--muted); font-size: .85rem; }
.fnotes { margin: 4px 0 0; padding-left: 1.15em; color: var(--muted); font-size: .88rem; display: grid; gap: 3px; }

/* Modus-Umschalter */
.mode { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.mode button { font: 700 .95rem/1 var(--f-display); text-transform: uppercase; letter-spacing: .06em; border: 0; border-radius: 999px; padding: 10px 8px; background: transparent; color: var(--muted); cursor: pointer; min-height: 40px; }
.mode button[aria-pressed="true"] { background: var(--bar); color: var(--bar-ink); }
.mode.sub { border-radius: 10px; grid-auto-flow: row; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
.mode.sub button { border-radius: 8px; font-size: .85rem; }
/* Lernversion */
.toc { display: grid; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; }
.toc a { color: var(--ink); text-decoration: none; padding: 5px 2px; border-bottom: 1px dashed var(--line); font-size: .95rem; }
.toc a:last-child { border-bottom: 0; }
.toc a b { display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--bg); font: 700 .78rem/1 var(--f-num); margin-right: 6px; }
.tsec { position: relative; scroll-margin-top: 80px; display: grid; }
.tnum { position: absolute; right: 10px; top: 10px; font: 700 .75rem/1 var(--f-num); color: var(--muted); }
/* Einsatzversion */
.scsrc { font: .78rem/1 var(--f-num); color: var(--muted); }
.sctrail { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 3px solid var(--line); display: grid; gap: 4px; font-size: .88rem; color: var(--muted); }
.sctrail li { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.sctrail .st { font-weight: 700; color: var(--ink); }
.sctrail .dn.med { color: var(--accent); }
.sctrail .ok { color: var(--ok); font-weight: 700; }
.sctrail .qt { flex: 1 1 60%; }
.sccur { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; box-shadow: 0 6px 18px rgb(0 0 0 / .08); }
.sccur.q { border-color: var(--warn); background: var(--warn-bg); }
.sccur.med { border-color: var(--accent); background: var(--accent-soft); }
.sccur.opt { border-style: dashed; border-color: var(--ink); }
.sccur.info { border-style: dotted; }
.sccur.fin { border-color: var(--bar); }
.sclab { font: 700 .78rem/1 var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.sctx { font-size: 1.3rem; line-height: 1.35; font-weight: 700; overflow-wrap: anywhere; }
.scbtns { display: grid; gap: 8px; }
.scbtns.two { grid-template-columns: 1fr 1fr; }
.scb { font: 700 1.1rem/1.2 var(--f-body); border: 0; border-radius: 12px; padding: 16px 12px; min-height: 60px; cursor: pointer; background: var(--bar); color: var(--bar-ink); overflow-wrap: anywhere; }
.scb.ja { background: var(--ok); color: var(--surface); text-transform: uppercase; letter-spacing: .05em; font-size: 1.3rem; }
.scb.nein { background: var(--block); color: var(--surface); text-transform: uppercase; letter-spacing: .05em; font-size: 1.3rem; }
.scb.x { background: var(--surface); color: var(--ink); border: 2px solid var(--accent); text-align: left; }
.scb.go { background: var(--bar); color: var(--bar-ink); }
.scbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sb { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 12px 8px; font: 600 .95rem/1 var(--f-body); cursor: pointer; min-height: 44px; }
.sb:disabled { opacity: .45; cursor: default; }
.scnotes summary { cursor: pointer; font: 700 .9rem/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .06em; }
.scnotes ul { margin: 6px 0 0; color: var(--muted); font-size: .9rem; }
.chip.mc { background: var(--accent-soft); border-color: var(--accent); }
.ck { display: grid; gap: 6px; }
.ckb { display: flex; gap: 10px; align-items: flex-start; text-align: left; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 10px; font: 1rem/1.35 var(--f-body); cursor: pointer; }
.ckb .box { flex: none; width: 24px; height: 24px; border: 2px solid var(--muted); border-radius: 6px; display: grid; place-items: center; font-weight: 700; color: var(--surface); }
.ckb.on { background: var(--ok-bg); }
.ckb.on .box { background: var(--ok); border-color: var(--ok); }
.ckb.on > span:last-child { color: var(--muted); text-decoration: line-through; }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <button class="back" id="back" hidden aria-label="Zurück">‹ Zurück</button>
      <h1>Gemeinsames Kompendium <span>Rettungsdienst</span><small class="unoff">Inoffizielle Nachschlage-App</small></h1>
      <button class="kgchip regchip" id="regchip" aria-label="Rettungsdienstbereich wählen">Bereich</button>
      <button class="kgchip" id="kgchip" aria-label="Gewicht für Dosierhilfe">– kg</button>
    </div>
    <input class="search" id="q" type="search" placeholder="Suchen: Medikament, Notfallbild, Symptom …" autocomplete="off" aria-label="Suche">
  </div>
</header>

<main id="view"></main>

<nav class="tabs" aria-label="Bereiche">
  <div class="tabs-in">
    <button class="tab" data-tab="meds"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-45 12 12)"/><path d="M9.2 9.2l5.6 5.6"/></svg>Medikamente</button>
    <button class="tab" data-tab="nf"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>Notfälle</button>
    <button class="tab" data-tab="dose"><svg viewBox="0 0 24 24"><path d="M5 20h14l-2-11H7z"/><circle cx="12" cy="6" r="2.5"/></svg>Dosierhilfe</button>
    <button class="tab" data-tab="info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>Hinweise</button>
  </div>
</nav>

<script>
/*__DATA__*/
</script>
<script>
(function () {
  const $ = s => document.querySelector(s);
  const view = $("#view"), q = $("#q"), back = $("#back"), kgchip = $("#kgchip"), regchip = $("#regchip");
  const regByCode = Object.fromEntries(KOMP_REGIONS.map(r => [r.c, r]));
  let region = null;
  try { const r = localStorage.getItem("rdregion"); if (r === "*" || regByCode[r]) region = r; } catch (e) {}
  function setRegion(r) { region = r; try { localStorage.setItem("rdregion", r); } catch (e) {} regchip.textContent = r === "*" ? "Alle" : (r || "Bereich"); }
  setRegion0();
  function setRegion0() { regchip.textContent = region === "*" ? "Alle" : (region ? (region === "TNA - Bergisches Land" ? "TNA-BL" : region) : "Bereich"); }
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const medById = Object.fromEntries(MEDS.map(m => [m.id, m]));
  const nfById = Object.fromEntries(NOTFAELLE.map(n => [n.id, n]));
  let weight = null;
  try { const w = parseFloat(sessionStorage.getItem("rdkg")); if (w > 0) weight = w; } catch (e) {}
  const DISCLAIMER = '<div class="notice"><strong>Nur Nachschlagehilfe.</strong> Ersetzt nicht die lokal gültige SAA / BPR, die Freigabe durch die Ärztliche Leitung Rettungsdienst oder die (tele-)notärztliche Anordnung. Inhalte ausschließlich aus Kompendium 2026 und Begleitheft 2026/2027.</div>';

  function srcLine(m) {
    const p = [];
    if (m.src.kp) p.push("Kompendium S. " + m.src.kp);
    if (m.src.bh) p.push("Begleitheft S. " + m.src.bh);
    return p.join(" · ");
  }
  function setWeight(w) {
    weight = w > 0 && w <= 300 ? Math.round(w * 10) / 10 : null;
    try { weight ? sessionStorage.setItem("rdkg", weight) : sessionStorage.removeItem("rdkg"); } catch (e) {}
    kgchip.textContent = weight ? fmt(weight, 1) + " kg" : "– kg";
  }
  setWeight(weight);

  // ── Routing über #token ──
  function go(h) { if (location.hash === "#" + h) render(); else location.hash = h; }
  window.addEventListener("hashchange", render);
  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { q.value = ""; go(b.dataset.tab); }));
  back.addEventListener("click", () => history.length > 1 ? history.back() : go("meds"));
  kgchip.addEventListener("click", () => go("dose"));
  regchip.addEventListener("click", () => go("bereich"));
  q.addEventListener("input", () => { const t = currentTab(); if (t !== "meds" && t !== "nf" && t !== "dose") { go("meds"); } else render(); });

  function currentTab() {
    const h = location.hash.slice(1) || "meds";
    if (h.startsWith("m-")) return "meds";
    if (h.startsWith("n-")) return "nf";
    if (h === "komp" || h === "bereich") return "info";
    return h;
  }
  function render() {
    const h = location.hash.slice(1) || "meds";
    const tab = currentTab();
    document.querySelectorAll(".tab").forEach(b => b.dataset.tab === tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
    const isDetail = h.startsWith("m-") || h.startsWith("n-") || h === "komp" || h === "bereich";
    back.hidden = !isDetail;
    q.parentElement.querySelector(".search").hidden = isDetail;
    if (h.startsWith("m-") && medById[h.slice(2)]) return renderMed(medById[h.slice(2)]);
    if (h.startsWith("n-") && nfById[h.slice(2)]) return renderNf(nfById[h.slice(2)]);
    if (tab === "nf") return renderNfList();
    if (tab === "dose") return renderDose();
    if (h === "bereich" || !region) return renderRegion();
    if (h === "komp") return renderKomp();
    if (tab === "info") return renderInfo();
    return renderMedList();
  }
  function scrollTop() { window.scrollTo(0, 0); }

  // ── Suche ──
  function norm(s) { return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  function medText(m) { return norm([m.name, m.search, m.wirkstoff, m.gruppe, ...(m.ind || [])].join(" ")); }
  function nfText(n) { return norm([n.title, n.search, n.cat, ...n.sections.flatMap(s => [s.h, ...s.items])].join(" ")); }
  function matches(text, query) { const words = norm(query).split(/\s+/).filter(Boolean); return words.every(w => text.includes(w)); }

  // ── Medikamente ──
  function renderMedList() {
    const query = q.value.trim();
    const meds = MEDS.filter(m => !query || matches(medText(m), query)).sort((a, b) => a.name.localeCompare(b.name, "de"));
    const nfs = query ? NOTFAELLE.filter(n => matches(nfText(n), query)) : [];
    let html = DISCLAIMER;
    html += '<h2 class="sec">Medikamente (' + meds.length + ')</h2>';
    html += meds.length ? '<div class="list">' + meds.map(medRow).join("") + "</div>" : '<p class="empty">Kein Medikament gefunden.</p>';
    if (nfs.length) html += '<h2 class="sec">Passende Notfallbilder</h2><div class="list">' + nfs.map(nfRow).join("") + "</div>";
    html += '<p class="hint">Orangener Punkt: mit Dosierhilfe. Gelber Punkt: Quellen widersprechen sich oder Angabe unklar.</p>';
    view.innerHTML = html; bindRows();
  }
  function medRow(m) {
    const dot = m.flags.length ? "flag" : (m.calc.length ? "calc" : "");
    return '<button class="row" data-go="m-' + m.id + '"><span class="dot ' + dot + '"></span><span class="t"><b>' + esc(m.name) + "</b><small>" + esc(m.ind.join(" · ")) + '</small></span><span class="pg">KP ' + (m.src.kp || "–") + "</span></button>";
  }
  function nfRow(n) {
    return '<button class="row" data-go="n-' + n.id + '"><span class="dot ' + (n.flags && n.flags.length ? "flag" : "") + '"></span><span class="t"><b>' + esc(n.title) + "</b><small>" + esc(n.cat) + '</small></span><span class="pg">' + esc(n.src.replace("KP ", "")) + "</span></button>";
  }
  function bindRows() { view.querySelectorAll("[data-go]").forEach(el => el.addEventListener("click", () => go(el.dataset.go))); }
  function ul(items) { return "<ul>" + items.map(i => "<li>" + esc(i) + "</li>").join("") + "</ul>"; }
  function card(title, items, cls) { if (!items || !items.length) return ""; return '<section class="card ' + (cls || "") + '"><h3>' + esc(title) + "</h3>" + ul(items) + "</section>"; }

  // ── Kompetenz nach Rettungsdienstbereich ──
  function regName(c) { return c === "*" ? "alle Bereiche" : (regByCode[c] ? regByCode[c].n : c); }
  function regShort(c) { return c === "TNA - Bergisches Land" ? "TNA-BL" : c; }
  function allRegHtml(r) {
    return '<details><summary>Alle Bereiche</summary><div class="allreg">' + KOMP_REGIONS.map(x => '<span class="' + (x.c === region ? "on" : "") + '">' + esc(x.n.replace(/ \(.*\)$/, "")) + '</span><span class="' + (x.c === region ? "on" : "") + '">' + esc(r.v[x.c] || "–") + "</span>" + (r.n && r.n[x.c] ? '<small style="grid-column:1/-1">* ' + esc(r.n[x.c].join(" · ")) + "</small>" : "")).join("") + "</div></details>";
  }
  function kompRows(rows, withGroup) {
    let last = null, h = "";
    rows.forEach(d => {
      if (withGroup && d.g !== last) { h += '<tr class="g"><td colspan="2">' + esc(d.g) + "</td></tr>"; last = d.g; }
      const notes = region !== "*" && d.n && d.n[region] ? d.n[region] : [];
      const val = region === "*" ? "" : (d.v[region] || "");
      h += "<tr><td>" + esc(d.l) + "<small>" + esc((withGroup ? "" : d.g + " · ") + d.src) + "</small>" + notes.map(n => "<small><b>* " + esc(n) + "</b></small>").join("") + allRegHtml(d) + "</td>";
      h += region === "*" ? "<td></td></tr>" : '<td class="lv' + (val ? "" : " none") + '">' + (val ? esc(val) : "kein Eintrag") + "</td></tr>";
    });
    return '<table class="dotab">' + h + "</table>";
  }
  function kompCard(rows) {
    if (!rows.length) return "";
    return '<section class="card do"><h3>Kompetenz – ' + esc(region === "*" ? "alle Bereiche" : regShort(region)) + "</h3>" + kompRows(rows, false) + '<div class="chips"><button class="chip" data-go="komp">Legende und alle Maßnahmen</button><button class="chip" data-go="bereich">Bereich wechseln</button></div></section>';
  }
  function exclFlags(id) {
    let h = "";
    const e = NF_EXCL[id];
    if (e && region !== "*" && e.r.includes(region)) h += '<div class="flag excl"><b>Gilt nicht in ' + esc(regName(region)) + ":</b> " + esc(e.t) + " – laut Kompendium „außer: " + esc(regName(region)) + "“.</div>";
    if (id === "mstart") MSTART_EXCL.forEach(x => { if (region !== "*" && x.r.includes(region)) h += '<div class="flag excl"><b>Gilt nicht in ' + esc(regName(region)) + ":</b> " + esc(x.t) + " (laut Kompendium „außer“).</div>"; });
    return h;
  }
  function renderRegion() {
    let html = '<article class="detail"><div class="dh"><h2>Rettungsdienstbereich</h2><div class="meta">In welchem Bereich bist du im Einsatz? Danach zeigt die App bei jedem Medikament und Notfallbild die Mindestqualifikation aus der Kompetenztabelle dieses Bereichs.</div></div>';
    html += '<div class="list">' + KOMP_REGIONS.slice().sort((a, b) => a.n.localeCompare(b.n, "de")).map(r => '<button class="row" data-reg="' + esc(r.c) + '"><span class="dot' + (r.c === region ? " calc" : "") + '"></span><span class="t"><b>' + esc(r.n.replace(/ \(.*\)$/, "")) + "</b>" + (/\(/.test(r.n) ? "<small>" + esc(r.n.match(/\((.*)\)/)[1]) + "</small>" : "") + '</span><span class="pg">' + esc(regShort(r.c)) + "</span></button>").join("") + '<button class="row" data-reg="*"><span class="dot' + (region === "*" ? " calc" : "") + '"></span><span class="t"><b>Kein Bereich</b><small>Bei jeder Maßnahme alle Bereiche zum Aufklappen</small></span></button></div>';
    html += '<div class="notice">Die Auswahl wird nur auf diesem Gerät gespeichert und lässt sich jederzeit oben über den Bereichs-Knopf ändern.</div></article>';
    view.innerHTML = html;
    view.querySelectorAll("[data-reg]").forEach(b => b.addEventListener("click", () => { setRegion(b.dataset.reg); setRegion0(); go("meds"); }));
    scrollTop();
  }
  function renderKomp() {
    let html = '<article class="detail"><div class="dh"><h2>Kompetenz ' + esc(region === "*" ? "– alle Bereiche" : regName(region).replace(/ \(.*\)$/, "")) + '</h2><div class="meta">Kompetenztabellen im Kompendium 2026</div></div>';
    html += '<div class="notice">' + esc(KOMP_NOTE) + "</div>";
    html += card("Legende", KOMP_LEGEND);
    html += '<section class="card do"><h3>Alle Einträge (' + KOMP.length + ")</h3>" + kompRows(KOMP, true) + "</section>";
    html += DISCLAIMER + "</article>";
    view.innerHTML = html; bindRows(); scrollTop();
  }
  function renderMed(m) {
    let html = '<article class="detail"><div class="dh"><h2>' + esc(m.name) + '</h2><div class="meta">' + esc(m.gruppe) + '</div><div class="src">' + esc(srcLine(m)) + "</div></div>";
    html += m.flags.map(f => '<div class="flag"><b>Achtung Quelle:</b> ' + esc(f) + "</div>").join("");
    if (m.calc.length) html += weight ? calcBlock(m, true) : '<div class="flag" style="border-color:var(--accent);background:var(--accent-soft)"><b style="color:var(--accent)">Dosierhilfe:</b> Gewicht eingeben über den Knopf „kg“ oben rechts, dann erscheinen hier die berechneten Dosen.</div>';
    html += card("Durchführung / Dosierung", m.dos, "dos");
    html += kompCard(KOMP.filter(d => d.med.includes(m.id)));
    html += '<div class="grid2">' + card("Indikationen", m.ind) + '<section class="card"><h3>Wirkstoff / Konzentration</h3><p style="margin:0"><b>' + esc(m.wirkstoff) + "</b><br>" + esc(m.konz) + "</p></section></div>";
    html += card("Keine Anwendung, wenn", m.ki, "ki");
    html += '<section class="card ki"><h3>Altersbegrenzung</h3><p style="margin:0">' + esc(m.alter) + "</p></section>";
    html += card("Nutzen-Risiko-Abwägung, wenn", m.nra);
    html += card("Unerwünschte Wirkungen / Risiken", m.uaw);
    html += card("Überdosierung / Gegenmaßnahmen", m.ueber);
    html += card("Besonderheiten", m.bes);
    const linked = NOTFAELLE.filter(n => (n.meds || []).includes(m.id));
    if (linked.length) html += '<section class="card"><h3>Kommt vor in</h3><div class="chips">' + linked.map(n => '<button class="chip" data-go="n-' + n.id + '">' + esc(n.title) + "</button>").join("") + "</div></section>";
    html += DISCLAIMER + "</article>";
    view.innerHTML = html; bindRows(); scrollTop();
  }

  // ── Dosierhilfe ──
  function ruleHtml(r) {
    const blocked = r.status === "block";
    let h = '<div class="rule' + (blocked ? " blocked" : "") + '"><div class="lab">' + esc(r.label) + (r.route ? " <small>· " + esc(r.route) + "</small>" : "") + "</div>";
    if (r.warn) h += '<div class="msg warn">' + esc(r.warn) + "</div>";
    if (r.kind === "agetable") {
      h += '<table class="age">' + r.rows.map(x => "<tr><td>" + esc(x[0]) + "</td><td>" + esc(x[1]) + "</td></tr>").join("") + "</table>";
    } else if (r.status === "nodata") {
      h += '<div class="msg info">Gewicht eingeben.</div>';
    } else if (r.kind === "range") {
      h += '<div class="big"><span class="dose">' + fmt(r.lo) + "–" + fmt(r.hi) + " " + esc(r.unit) + '</span></div><div class="formula">' + esc(r.formula) + "</div>";
    } else {
      r.messages.filter(x => x.t === "block").forEach(x => h += '<div class="msg block">' + esc(x.m) + "</div>");
      if (r.dose !== undefined) {
        h += '<div class="big"><span class="dose">' + fmt(r.dose) + " " + esc(r.unit) + "</span>";
        (r.vol || []).forEach(v => h += '<span class="vol">' + fmt(v.ml, 2) + " ml <span>bei " + esc(v.label) + "</span></span>");
        h += '</div><div class="formula">' + esc(r.formula) + "</div>";
      }
      r.messages.filter(x => x.t !== "block").forEach(x => h += '<div class="msg ' + x.t + '">' + esc(x.m) + "</div>");
      if (r.bands) h += '<ul class="bands">' + r.bands.map(b => '<li class="' + (b.active ? "on" : "") + '">' + esc(b.text) + "</li>").join("") + "</ul>";
    }
    if (r.note) h += '<div class="hint">' + esc(r.note) + "</div>";
    return h + "</div>";
  }
  function calcBlock(m, inDetail) {
    const rules = m.calc.map(c => ruleHtml(computeRule(c, weight))).join("");
    return '<section class="res"><div class="res-h"><b>' + (inDetail ? "Dosierhilfe für " + fmt(weight, 1) + " kg" : esc(m.name)) + "</b>" + (inDetail ? '<button data-go="dose">Gewicht ändern</button>' : '<button data-go="m-' + m.id + '">Alle Angaben</button>') + "</div>" + rules + "</section>";
  }
  function renderDose() {
    const query = q.value.trim();
    let html = '<section class="kgbox"><div class="kgrow"><label for="kg">Körpergewicht (kg)<input class="kgin" id="kg" type="number" inputmode="decimal" min="0.5" max="300" step="0.1" value="' + (weight ?? "") + '" placeholder="z.B. 20"></label>' +
      '<div class="steps">' + [3, 5, 10, 15, 20, 30, 50, 70, 90].map(k => '<button data-kg="' + k + '">' + k + "</button>").join("") + "</div></div>" +
      '<div class="hint">Berechnet werden nur Dosen, die in der Quelle gewichtsbezogen angegeben sind. Fentanyl: ideales Körpergewicht. Volumen nur bei Konzentrationen, die die Quelle nennt. Altersgrenzen stehen bei jedem Eintrag und werden nicht automatisch geprüft.</div></section>';
    const meds = MEDS.filter(m => m.calc.length && (!query || matches(medText(m), query))).sort((a, b) => a.name.localeCompare(b.name, "de"));
    if (!weight) html += '<p class="empty">Gewicht eingeben oder einen Schnellwert antippen.</p>';
    else {
      html += meds.map(m => calcBlock(m, false)).join("");
      if (!query) html += EXTRA_CALC.map(x => '<section class="res"><div class="res-h"><b>' + esc(x.title) + '</b><span class="src">' + esc(x.src) + "</span></div>" + x.calc.map(c => ruleHtml(computeRule(c, weight))).join("") + "</section>").join("");
      if (!meds.length) html += '<p class="empty">Kein Medikament mit Dosierhilfe passt zur Suche.</p>';
    }
    html += DISCLAIMER;
    view.innerHTML = html; bindRows();
    const kg = $("#kg");
    kg.addEventListener("input", () => { const v = parseFloat(String(kg.value).replace(",", ".")); setWeight(v); updateDoseResults(); });
    view.querySelectorAll("[data-kg]").forEach(b => b.addEventListener("click", () => { setWeight(+b.dataset.kg); render(); }));
  }
  function updateDoseResults() {
    // Ergebnisse neu zeichnen, ohne das Eingabefeld zu ersetzen
    const box = view.querySelector(".kgbox");
    view.querySelectorAll(".res, .empty, .notice").forEach(el => el.remove());
    const query = q.value.trim();
    let html = "";
    const meds = MEDS.filter(m => m.calc.length && (!query || matches(medText(m), query))).sort((a, b) => a.name.localeCompare(b.name, "de"));
    if (!weight) html += '<p class="empty">Gewicht eingeben oder einen Schnellwert antippen.</p>';
    else {
      html += meds.map(m => calcBlock(m, false)).join("");
      if (!query) html += EXTRA_CALC.map(x => '<section class="res"><div class="res-h"><b>' + esc(x.title) + '</b><span class="src">' + esc(x.src) + "</span></div>" + x.calc.map(c => ruleHtml(computeRule(c, weight))).join("") + "</section>").join("");
    }
    html += DISCLAIMER;
    box.insertAdjacentHTML("afterend", html); bindRows();
  }

  // ── Notfälle ──
  const CATS = ["Herangehensweise", "Reanimation", "Leitsymptom", "Krankheitsbild", "Trauma / MANV"];
  function renderNfList() {
    const query = q.value.trim();
    let html = DISCLAIMER;
    let count = 0;
    CATS.forEach(c => {
      const items = NOTFAELLE.filter(n => n.cat === c && (!query || matches(nfText(n), query)));
      count += items.length;
      if (items.length) html += '<h2 class="sec">' + esc(c === "Leitsymptom" ? "Leitsymptome" : c === "Krankheitsbild" ? "Krankheitsbilder" : c) + "</h2><div class=\"list\">" + items.map(nfRow).join("") + "</div>";
    });
    if (!count) html += '<p class="empty">Kein Notfallbild gefunden.</p>';
    if (query) { const meds = MEDS.filter(m => matches(medText(m), query)); if (meds.length) html += '<h2 class="sec">Passende Medikamente</h2><div class="list">' + meds.map(medRow).join("") + "</div>"; }
    view.innerHTML = html; bindRows();
  }
  // ── Abzweigungen in Notfallbildern: „Bedingung ➜ Maßnahme“ als Wenn-dann-Block ──
  const NF_LINKS = [["sepsis","sepsis"],["schmerz","schmerz"],["dehydratation","dehydratation"],["bronchialobstruktion","bronch"],["bradykardie","brady"],["brady-","brady"],["tachykardie","tachy"],["atemwegsmanagement","atemweg"],["anaphylaxie","anaphylaxie"],["fremdkörper","fremdkoerper"],["blutung","blutung"],["schlaganfall","stroke"],["neugeborene","nls"],["post-rosc","postrosc"],["lungenödem","lungenoedem"],["lungenembolie","lae"],["lungenarterienembolie","lae"],["krampfanfall","krampf_erw"],["co-intoxikation","co"],["intoxikation","intox"],["hypoglykämie","hypoglyk"],["hyperglykämie","hyperglyk"],["dyspnoe","dyspnoe"],["d-problem","dtrauma"],["b-problem","btrauma"],["acs","acs"],["brustschmerz","acs"],["polytrauma","trauma"],["als","als"],["pls","pls"]];
  function nfLinks(text, selfId) {
    const m = text.match(/BPR ([^;]*)/); if (!m) return "";
    const s = m[1].toLowerCase(), ids = [];
    NF_LINKS.forEach(([k, id]) => { const re = new RegExp("(^|[^a-zäöü])" + k.replace(/[-/]/g, "\\$&") + "([^a-zäöü]|$)"); if (re.test(s) && !ids.includes(id) && id !== selfId && nfById[id]) ids.push(id); });
    if (ids.includes("co")) ids.splice(ids.indexOf("intox"), ids.includes("intox") ? 1 : 0);
    return ids.map(id => '<button class="chip lk" data-go="n-' + id + '">' + esc(nfById[id].title) + "</button>").join("");
  }
  function arrowSplit(s) {
    const parts = []; let depth = 0, cur = "";
    for (const ch of s) { if (ch === "(") depth++; if (ch === ")") depth = Math.max(0, depth - 1); if (ch === "➜" && depth === 0) { parts.push(cur.trim()); cur = ""; } else cur += ch; }
    parts.push(cur.trim()); return parts.filter(Boolean);
  }
  function branchRow(seg, first, selfId) {
    const p = arrowSplit(seg); if (p.length < 2) return '<div class="c' + (first ? "" : " sub") + '">' + esc(seg) + "</div>";
    const q = /\?$/.test(p[0]);
    return '<div class="c' + (first ? "" : " sub") + '">' + esc(p[0]) + "</div>" + p.slice(1).map((a, k) => '<div class="a">' + (q && k === 0 ? '<span class="ja">ja</span>' : "") + "<span>" + esc(a) + nfLinks(a, selfId) + "</span></div>").join("");
  }
  function nfItem(i, selfId) {
    if (arrowSplit(i).length < 2) return "<li>" + esc(i) + "</li>";
    let segs = i.split(/;\s+/);
    if (segs.filter(s => arrowSplit(s).length > 1).length < 2) segs = [i];
    let label = "";
    const lm = segs[0].match(/^([^:➜()]{2,28}):\s+(.*)$/);
    if (segs.length > 1 && lm && arrowSplit(lm[2]).length > 1) { label = lm[1]; segs[0] = lm[2]; }
    return '<li class="br">' + (label ? '<div class="gl">' + esc(label) + "</div>" : "") + segs.map((s, k) => branchRow(s, k === 0, selfId)).join("") + "</li>";
  }
  // ── Flussdiagramme: Ablauf mit allen Verzweigungen (aus FLOWS, KP-Seiten) ──
  function flowLinks(text, selfId) {
    if (!/BPR|SAA|Algorithmus|Leitsymptom|siehe|weiter (mit|nach)/i.test(text)) return "";
    const s = text.toLowerCase(), ids = [];
    NF_LINKS.forEach(([k, id]) => { const re = new RegExp("(^|[^a-zäöü])" + k.replace(/[-/]/g, "\\$&") + "([^a-zäöü]|$)"); if (re.test(s) && !ids.includes(id) && id !== selfId && nfById[id]) ids.push(id); });
    if (ids.includes("co") && ids.includes("intox")) ids.splice(ids.indexOf("intox"), 1);
    return ids.length ? '<span class="fln">' + ids.map(id => '<button class="chip lk" data-go="n-' + id + '">' + esc(nfById[id].title) + "</button>").join("") + "</span>" : "";
  }
  function brClass(l) { const x = l.trim().toLowerCase(); return x === "ja" ? "ja" : x === "nein" ? "nein" : "x"; }
  function flowEnds(list) {
    const l = list && list[list.length - 1]; if (!l) return false;
    if (l.end != null || l.go != null) return true;
    return l.q != null && (l.b || []).length > 0 && l.b.every(b => flowEnds(b.n));
  }
  function flowNodes(list, selfId) {
    return list.map(nd => {
      if (nd.q != null) {
        return '<li class="fq">' + (nd.q ? '<div class="qq"><span class="qm" aria-hidden="true">?</span><span>' + esc(nd.q) + "</span></div>" : "") + '<div class="bs">' + (nd.b || []).map(b => {
          const lab = '<span class="bl ' + brClass(b.l) + '">' + (b.l.trim() ? esc(b.l) : "➜") + "</span>";
          if (!b.n || !b.n.length) return '<div class="bx ' + brClass(b.l) + ' empty">' + lab + '<span class="wt">weiter im Ablauf ↓</span></div>';
          const ends = flowEnds(b.n);
          return '<details class="bx ' + brClass(b.l) + '" open><summary>' + lab + "</summary><ol class=\"fl\">" + flowNodes(b.n, selfId) + (ends ? "" : '<li class="fc">weiter im Ablauf ↓</li>') + "</ol></details>";
        }).join("") + "</div></li>";
      }
      if (nd.end != null) return '<li class="fe"><span>' + esc(nd.end) + "</span>" + flowLinks(nd.end, selfId) + "</li>";
      if (nd.go != null) return '<li class="fg"><span>' + esc(nd.go) + "</span>" + flowLinks(nd.go, selfId) + "</li>";
      return '<li class="fs' + (nd.k ? " " + nd.k : "") + '"><span>' + esc(nd.s) + "</span>" + flowLinks(nd.s, selfId) + "</li>";
    }).join("");
  }
  function flowCard(n) {
    const pages = (typeof FLOWS !== "undefined" && FLOWS[n.id]) || [];
    if (!pages.length) return "";
    let html = '<section class="card flow"><h3>Ablauf <span class="fsrc">Kompendium S. ' + pages.map(p => p.page).join(", ") + "</span></h3>";
    html += '<div class="flegend"><span class="bl ja">ja</span><span class="bl nein">nein</span><span class="lg med">Medikament</span><span class="lg opt">optional</span><span class="lg fe">Ende</span></div>';
    pages.forEach(p => {
      p.flows.forEach(f => {
        if (pages.length > 1 || p.flows.length > 1) html += '<div class="fh">' + esc(f.h || p.title) + "</div>";
        html += '<ol class="fl root">' + (f.start ? '<li class="fst"><span>' + esc(f.start) + "</span></li>" : "") + flowNodes(f.steps || [], n.id) + "</ol>";
      });
      if (p.notes && p.notes.length) html += '<ul class="fnotes">' + p.notes.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>";
    });
    return html + "</section>";
  }
  function nfCard(title, items, selfId) {
    if (!items || !items.length) return "";
    return '<section class="card"><h3>' + esc(title) + "</h3><ul>" + items.map(i => nfItem(i, selfId)).join("") + "</ul></section>";
  }
  // ── Modus: Lernen / Einsatz ──
  let nfMode = "learn";
  try { nfMode = localStorage.getItem("rdnfmode") === "scene" ? "scene" : "learn"; } catch (e) {}
  function setMode(m) { nfMode = m; try { localStorage.setItem("rdnfmode", m); } catch (e) {} render(); }
  function modeSwitch() {
    return '<div class="mode" role="group" aria-label="Ansicht"><button data-mode="learn" aria-pressed="' + (nfMode === "learn") + '">Lernen</button><button data-mode="scene" aria-pressed="' + (nfMode === "scene") + '">Einsatz</button></div>';
  }
  function bindMode() { view.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode))); }
  const MED_KEYS = MEDS.map(m => [m.id, [m.name.split(/[ (]/)[0]].concat({ gtn: ["Nitro", "Glyceroltrinitrat"], epinephrin: ["Adrenalin", "Epinephrin"], ass: ["ASS", "Acetylsalicyl"], vel: ["VEL", "Vollelektrolyt"], sauerstoff: ["O2", "Sauerstoff"], txa: ["Tranexam"], ipratropium: ["Ipratropium"], diazepam: ["Diazepam"], esketamin: ["Esketamin"] }[m.id] || [])]);
  function medChips(text) {
    const ids = [];
    MED_KEYS.forEach(([id, keys]) => { if (keys.some(k => new RegExp("(^|[^A-Za-zÄÖÜäöüß])" + k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + (k.length <= 4 ? "([^A-Za-zäöü]|$)" : ""), k.length <= 4 ? "" : "i").test(text)) && !ids.includes(id)) ids.push(id); });
    if (ids.includes("esketamin") && ids.includes("ketamin") && !/(^|[^s])ketamin/i.test(text.replace(/esketamin/gi, ""))) ids.splice(ids.indexOf("ketamin"), 1);
    return ids.map(id => '<button class="chip mc" data-go="m-' + id + '">' + esc(medById[id].name) + " ›</button>").join("");
  }

  // Lernversion: geordnet mit Inhaltsverzeichnis
  function renderNfLearn(n, head) {
    const fc = flowCard(n);
    const secs = [];
    if (fc) secs.push(["Ablauf", fc]);
    n.sections.forEach(s => { const c = nfCard(s.h, s.items, n.id); if (c) secs.push([s.h, c]); });
    const kc = kompCard(KOMP.filter(d => d.nf.includes(n.id)));
    if (kc) secs.push(["Kompetenz", kc]);
    if (n.meds && n.meds.length) secs.push(["Medikamente", '<section class="card"><h3>Medikamente</h3><div class="chips">' + n.meds.map(id => '<button class="chip" data-go="m-' + id + '">' + esc(medById[id].name) + "</button>").join("") + "</div></section>"]);
    let html = head;
    if (n.note && !fc) html += '<div class="hint">' + esc(n.note) + "</div>";
    if (secs.length > 2) html += '<nav class="toc" aria-label="Inhalt">' + secs.map((s, i) => '<a href="#" data-toc="t' + i + '"><b>' + (i + 1) + "</b> " + esc(s[0]) + "</a>").join("") + "</nav>";
    html += secs.map((s, i) => '<div class="tsec" id="t' + i + '">' + s[1] + "</div>").join("");
    return html;
  }

  // Einsatzversion: Flussdiagramm Schritt für Schritt
  function sceneKey(n) { return "rdscene-" + n.id; }
  function sceneLoad(n) { try { const s = JSON.parse(sessionStorage.getItem(sceneKey(n)) || "null"); if (s && Array.isArray(s.a)) return s; } catch (e) {} return { f: 0, a: [] }; }
  function sceneSave(n, s) { try { sessionStorage.setItem(sceneKey(n), JSON.stringify(s)); } catch (e) {} }
  function sceneFlows(n) { const out = []; ((typeof FLOWS !== "undefined" && FLOWS[n.id]) || []).forEach(p => p.flows.forEach(f => out.push({ page: p.page, title: p.title, f, notes: p.notes }))); return out; }
  // Ablauf nachspielen: Stapel aus [Liste, Index]; Aktionen: "n" = weiter, Zahl = Zweig
  function sceneWalk(flow, actions) {
    const stack = [[flow.steps || [], 0]], trail = [];
    let pos = 0;
    function cur() {
      while (stack.length) { const top = stack[stack.length - 1]; if (top[1] < top[0].length) return top[0][top[1]]; stack.pop(); if (stack.length) stack[stack.length - 1][1]++; }
      return null;
    }
    for (; pos < actions.length; pos++) {
      const nd = cur(); if (!nd || nd.end != null || nd.go != null) break;
      const a = actions[pos];
      if (nd.q != null) {
        const b = (nd.b || [])[a]; if (!b) break;
        trail.push({ t: nd.q, l: b.l || "➜", c: brClass(b.l || "") });
        if (b.n && b.n.length) stack.push([b.n, 0]); else stack[stack.length - 1][1]++;
      } else { trail.push({ t: nd.s, done: 1, k: nd.k }); stack[stack.length - 1][1]++; }
    }
    return { node: cur(), trail, used: pos };
  }
  function branchText(b) {
    if (b.l && b.l.trim()) return b.l;
    const f = b.n && b.n[0]; if (!f) return "weiter";
    return (f.s || f.q || f.end || f.go || "weiter");
  }
  function renderNfScene(n, head) {
    const flows = sceneFlows(n);
    let html = head;
    if (!flows.length) {
      html += '<div class="hint">Für dieses Notfallbild gibt es im Kompendium kein Flussdiagramm. Hier die Punkte zum Abhaken.</div>';
      const st = sceneLoad(n);
      n.sections.forEach((s, si) => {
        if (!s.items || !s.items.length) return;
        html += '<section class="card"><h3>' + esc(s.h) + '</h3><div class="ck">' + s.items.map((it, ii) => { const k = si + "." + ii, on = st.a.includes(k); return '<button class="ckb' + (on ? " on" : "") + '" data-ck="' + k + '" aria-pressed="' + on + '"><span class="box" aria-hidden="true">' + (on ? "✓" : "") + "</span><span>" + esc(it) + "</span></button>"; }).join("") + "</div></section>";
      });
      html += '<div class="scbar"><button class="sb" data-sc="reset">Häkchen löschen</button></div>';
      return html;
    }
    const st = sceneLoad(n); if (st.f >= flows.length) st.f = 0;
    const F = flows[st.f];
    const w = sceneWalk(F.f, st.a);
    if (w.used < st.a.length) { st.a = st.a.slice(0, w.used); sceneSave(n, st); }
    html += '<div class="scsrc">Kompendium S. ' + F.page + (flows.length > 1 ? "" : "") + "</div>";
    if (flows.length > 1) html += '<div class="mode sub" role="group" aria-label="Ablauf">' + flows.map((x, i) => '<button data-scf="' + i + '" aria-pressed="' + (i === st.f) + '">' + esc(x.f.h || x.title) + "</button>").join("") + "</div>";
    html += '<ol class="sctrail">' + (F.f.start ? '<li class="st">' + esc(F.f.start) + "</li>" : "") + w.trail.map(x => x.done ? '<li class="dn' + (x.k ? " " + x.k : "") + '"><span class="ok">✓</span>' + esc(x.t) + "</li>" : '<li class="an"><span class="qt">' + esc(x.t) + '</span><span class="bl ' + x.c + '">' + esc(x.l) + "</span></li>").join("") + "</ol>";
    const nd = w.node;
    if (!nd) {
      html += '<section class="sccur fin"><div class="sclab">Ablauf zu Ende</div><div class="sctx">Das Diagramm endet hier ohne eigenen Endpunkt.</div></section>';
    } else if (nd.q != null) {
      html += '<section class="sccur q"><div class="sclab">Entscheidung</div><div class="sctx">' + esc(nd.q || "Wie geht es weiter?") + "</div>" + '<div class="scbtns' + ((nd.b || []).length === 2 ? " two" : "") + '">' + (nd.b || []).map((b, i) => '<button class="scb ' + brClass(b.l || "") + '" data-sca="' + i + '">' + esc(branchText(b)) + "</button>").join("") + "</div></section>";
    } else if (nd.end != null || nd.go != null) {
      const tx = nd.end != null ? nd.end : nd.go;
      html += '<section class="sccur fin"><div class="sclab">' + (nd.end != null ? "Endpunkt" : "Weiter mit") + '</div><div class="sctx">' + esc(tx) + "</div>" + flowLinks(tx, n.id) + '<div class="chips">' + medChips(tx) + "</div></section>";
    } else {
      html += '<section class="sccur ' + (nd.k || "s") + '"><div class="sclab">' + (nd.k === "med" ? "Medikament" : nd.k === "opt" ? "Optional" : nd.k === "info" ? "Hinweis" : "Maßnahme") + '</div><div class="sctx">' + esc(nd.s) + "</div>" + flowLinks(nd.s, n.id) + '<div class="chips">' + medChips(nd.s) + '</div><button class="scb go" data-sca="n">' + (nd.k === "info" ? "Gelesen, weiter" : nd.k === "opt" ? "Weiter" : "Erledigt, weiter") + " ▸</button></section>";
    }
    html += '<div class="scbar"><button class="sb" data-sc="back"' + (st.a.length ? "" : " disabled") + '>◂ Schritt zurück</button><button class="sb" data-sc="reset"' + (st.a.length ? "" : " disabled") + ">↺ Neu starten</button></div>";
    if (F.notes && F.notes.length) html += '<details class="card scnotes"><summary>Hinweise zur Seite</summary><ul>' + F.notes.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></details>";
    html += kompCard(KOMP.filter(d => d.nf.includes(n.id)));
    return html;
  }
  function bindScene(n) {
    const st = sceneLoad(n);
    const upd = () => { sceneSave(n, st); renderNf(n, true); };
    view.querySelectorAll("[data-sca]").forEach(b => b.addEventListener("click", () => { const v = b.dataset.sca; st.a.push(v === "n" ? "n" : +v); upd(); }));
    view.querySelectorAll("[data-scf]").forEach(b => b.addEventListener("click", () => { st.f = +b.dataset.scf; st.a = []; upd(); }));
    view.querySelectorAll("[data-sc]").forEach(b => b.addEventListener("click", () => { if (b.dataset.sc === "back") st.a.pop(); else st.a = []; upd(); }));
    view.querySelectorAll("[data-ck]").forEach(b => b.addEventListener("click", () => { const k = b.dataset.ck, i = st.a.indexOf(k); i < 0 ? st.a.push(k) : st.a.splice(i, 1); upd(); }));
    view.querySelectorAll("[data-toc]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); const el = document.getElementById(a.dataset.toc); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }));
  }
  function renderNf(n, keepScroll) {
    let head = '<article class="detail' + (nfMode === "scene" ? " scene" : "") + '"><div class="dh"><h2>' + esc(n.title) + '</h2><div class="meta">' + esc(n.cat) + '</div><div class="src">' + esc(n.src.replace("KP", "Kompendium").replace("BH", "Begleitheft")) + "</div></div>" + modeSwitch();
    head += exclFlags(n.id);
    (n.flags || []).forEach(f => head += '<div class="flag"><b>Achtung Quelle:</b> ' + esc(f) + "</div>");
    let html = nfMode === "scene" ? renderNfScene(n, head) : renderNfLearn(n, head);
    html += DISCLAIMER + "</article>";
    view.innerHTML = html; bindRows(); bindMode(); bindScene(n);
    if (!keepScroll) scrollTop();
    else { const c = view.querySelector(".sccur"); if (c) { const r = c.getBoundingClientRect(); if (r.top < 70 || r.bottom > innerHeight - 80) window.scrollTo(0, scrollY + r.top - 120); } }
  }


  // ── Hinweise ──
  function renderInfo() {
    let html = '<article class="detail"><div class="dh"><h2>Hinweise</h2></div>';
    html += '<section class="card ki"><h3>Wofür diese App ist</h3><ul><li>Inoffizielle Nachschlage-App, nicht herausgegeben von den Ärztlichen Leitungen Rettungsdienst. Inhalte aus dem Gemeinsamen Kompendium Rettungsdienst 2026 und dem Begleitheft Medikamente 2026/2027.</li><li>Jedes Notfallbild hat zwei Ansichten: „Lernen“ zeigt alles geordnet mit Inhaltsverzeichnis, „Einsatz“ führt Schritt für Schritt mit Ja/Nein-Tasten durch das Flussdiagramm (ohne Diagramm: Abhakliste). Die gewählte Ansicht bleibt gespeichert.</li><li>Schnelles Nachschlagen im Einsatz. Sie ersetzt nicht die lokal gültigen SAA / BPR, die Freigabe durch die Ärztliche Leitung Rettungsdienst oder die (tele-)notärztliche Anordnung.</li><li>Laut Begleitheft gelten die aufgeführten Kontraindikationen als absolute Kontraindikationen, solange Notfallsanitäter ohne (tele-)notärztliche Unterstützung tätig werden.</li><li>Vor jeder Gabe: Notarztruf nach lokalem Indikationskatalog, Aufklärung und Einwilligung, 6-R-Regel (Patient, Medikament, Dosierung, Zeitpunkt, Konzentration, Applikationsart), Spritzen beschriften, Doppelkontrolle („read back“).</li></ul></section>';
    html += '<section class="card do"><h3>Rettungsdienstbereich: ' + esc(regName(region).replace(/ \(.*\)$/, "")) + '</h3><p style="margin:0">Bei jedem Medikament und Notfallbild steht die Mindestqualifikation aus der Kompetenztabelle dieses Bereichs.</p><div class="chips"><button class="chip" data-go="komp">Alle ' + KOMP.length + ' Einträge und Legende</button><button class="chip" data-go="bereich">Bereich wechseln</button></div></section>';
    html += '<section class="card"><h3>Quellen</h3><ul><li>Gemeinsames Kompendium Rettungsdienst 2026 (Seitenangabe „Kompendium S.“ / „KP“)</li><li>Begleitheft Medikamente 2026/2027 (Seitenangabe „Begleitheft S.“ / „BH“)</li><li>Keine Inhalte aus anderen Quellen oder Allgemeinwissen ergänzt.</li></ul></section>';
    html += '<section class="card"><h3>Was die App bewusst nicht enthält</h3><ul><li>Die Kompetenztabellen der invasiven Maßnahmen sind enthalten, deren SAA-Texte (Durchführung, Risiken) aber nicht.</li><li>Die Flussdiagramme als Originalgrafik. Sie sind als „Ablauf“ mit allen Ja/Nein-Zweigen nachgebaut; bei Unklarheit gilt das Original.</li><li>Die SAA zu invasiven Maßnahmen (i.v./i.o.-Zugang, EGA, Defibrillation usw.).</li></ul></section>';
    html += '<section class="card"><h3>Darstellung</h3><div class="chips"><button class="chip" data-theme-set="">System</button><button class="chip" data-theme-set="light">Hell</button><button class="chip" data-theme-set="dark">Dunkel</button></div></section>';
    html += "</article>";
    view.innerHTML = html; bindRows();
    view.querySelectorAll("[data-theme-set]").forEach(b => b.addEventListener("click", () => { const t = b.dataset.themeSet; t ? document.documentElement.setAttribute("data-theme", t) : document.documentElement.removeAttribute("data-theme"); try { localStorage.setItem("rdtheme", t); } catch (e) {} }));
  }
  try { const t = localStorage.getItem("rdtheme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}

  render();
})();
</script>
